<!doctype html><html lang="no"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#102b49"><title>AKK. – Presseakkreditering</title><style>:root{font-family:system-ui,-apple-system,sans-serif;color:#172b42;background:#f2f5f9}*{box-sizing:border-box}body{margin:0}header{background:#102b49;color:white;padding:25px 20px}header h1{font-size:38px;margin:0}header p{margin:5px 0;color:#c7d6e5}main{max-width:920px;margin:auto;padding:18px}section{background:white;padding:20px;border-radius:17px;margin-bottom:16px;box-shadow:0 2px 12px #112b4610}h2{font-size:19px;margin:0 0 14px}label{display:block;font-size:13px;font-weight:650;margin:12px 0 5px}input,select,textarea{width:100%;font:inherit;padding:12px;border:1px solid #cbd4df;border-radius:10px;background:white;color:#172b42}textarea{min-height:76px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.grid>*{min-width:0}.check{display:flex;align-items:flex-start;gap:10px;font-weight:500;font-size:14px;margin:12px 0}.check input{width:18px;height:18px;margin:1px 0;flex:none}.person{border:1px solid #e1e7ef;padding:12px;border-radius:12px;margin:10px 0}.person .grid{grid-template-columns:1fr 1fr}button{font:inherit;font-weight:650;border:0;border-radius:11px;padding:12px 16px;cursor:pointer}button.primary{background:#173e67;color:white}button.secondary{background:#e8eff7;color:#173e67}button.danger{background:#fff0f0;color:#9c3030}button:active{opacity:.75}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:15px}.preview{white-space:pre-wrap;font-size:14px;line-height:1.7;color:#1d2937;border:1px solid #e2e8ef;border-radius:12px;padding:20px;background:#fff}small,.hint{color:#66798c;font-size:12px}footer{text-align:center;padding:20px;color:#60738b;font-size:13px}@media(max-width:620px){.grid,.person .grid{grid-template-columns:1fr}section{padding:16px}main{padding:12px}}@media print{header,main>section:not(#output),footer,.actions,.hint{display:none!important}body{background:white}main{padding:0;max-width:none}#output{box-shadow:none;padding:0;margin:0}.preview{border:0;padding:0;font-size:12pt;line-height:1.5}h2{display:none}}</style></head><body><header><div style="max-width:920px;margin:auto"><h1>AKK.</h1><p>Presseakkreditering, enkelt og greit.</p></div></header><main><section><h2>Kampen</h2><div class="grid"><div><label for="home">Hjemmelag</label><input id="home" placeholder="Real Madrid"></div><div><label for="away">Bortelag</label><input id="away" placeholder="Atlético Madrid"></div><div><label for="date">Kampdato</label><input id="date" type="date"></div><div><label for="language">Språk</label><select id="language"><option value="en">English</option><option value="no">Norsk</option><option value="de">Deutsch</option><option value="es">Español</option><option value="fr">Français</option><option value="it">Italiano</option></select></div><div><label for="media">Mediehus</label><select id="media"><option>NRK Sport</option><option>NRK</option><option>TV 2 Sport</option><option>Dagbladet</option><option value="other">Annet</option></select></div><div id="otherWrap" hidden><label for="other">Navn på mediehus</label><input id="other"></div></div></section><section><h2>Journalister</h2><div id="people"></div><button class="secondary" type="button" id="add">+ Legg til person</button></section><section><h2>Hva ønsker dere tilgang til?</h2><label class="check"><input id="social" type="checkbox">Vi lager også innhold til sosiale medier</label><label class="check"><input id="broad" type="checkbox">Ønsk bredest mulig tilgang (innenfor klubbens rammer)</label><div id="access"></div><label class="check"><input id="angleOn" type="checkbox">Spesiell vinkling / noe vi ønsker å nevne</label><textarea id="angle" placeholder="Valgfri kort forklaring" hidden></textarea></section><section id="output"><h2>Forhåndsvisning</h2><div class="preview" id="preview"></div><div class="actions"><button class="primary" id="pdf">Lagre som PDF</button><button class="secondary" id="copy">Kopier tekst</button></div><p class="hint">På iPhone: Trykk «Lagre som PDF», bruk deretter delings-/utskriftsvalget for å lagre PDF i Filer. PDF-en lages lokalt på enheten.</p></section></main><footer>«Akk så me har troffe litt!»</footer><script>
const $=id=>document.getElementById(id);let counter=0;
const items=[['tribune','Press tribune'],['mixed','Mixed zone'],['conference','Press conference'],['pitch','Pitchside / field-level access'],['training','Training session'],['players','Player interviews'],['coach','Coach interview'],['challenge','Social media activities with players'],['tour','Behind-the-scenes / stadium tour']];
const tr={en:{subject:'Press accreditation request',hello:'Dear Media / Accreditation Team,',intro:'We would like to request press accreditation for the following match:',for:'Representing',app:'Applicants',access:'If possible, we would also appreciate access to:',social:'Our coverage includes short-form video and content for our sports social media channels.',broad:'We would be grateful for the broadest access reasonably available to support our coverage, always subject to club policies, operational requirements and the team’s schedule.',angle:'Additional editorial context',close:'We understand that access is subject to availability and your accreditation guidelines. Thank you for considering our request. We look forward to hearing from you.',regards:'Kind regards',date:'Date',roles:'Role'},no:{subject:'Søknad om presseakkreditering',hello:'Hei til medie- og akkrediteringsansvarlig,',intro:'Vi ønsker å søke om presseakkreditering til følgende kamp:',for:'På vegne av',app:'Søkere',access:'Dersom det er mulig, ønsker vi også tilgang til:',social:'Vi lager også kortvideoer og innhold til våre sportskanaler i sosiale medier.',broad:'Vi setter pris på så bred tilgang som praktisk mulig, naturligvis innenfor klubbens retningslinjer og lagets program.',angle:'Ytterligere redaksjonell informasjon',close:'Vi har forståelse for at tilgang avhenger av kapasitet og gjeldende regler. Takk for at dere vurderer søknaden. Vi ser frem til å høre fra dere.',regards:'Med vennlig hilsen',date:'Dato',roles:'Rolle'},de:{subject:'Antrag auf Presseakkreditierung',hello:'Sehr geehrtes Medien- und Akkreditierungsteam,',intro:'Wir möchten eine Presseakkreditierung für das folgende Spiel beantragen:',for:'Medium',app:'Antragstellende',access:'Falls möglich, bitten wir außerdem um Zugang zu:',social:'Unsere Berichterstattung umfasst auch Kurzvideos und Inhalte für die Social-Media-Kanäle unserer Sportredaktion.',broad:'Wir würden uns über einen möglichst umfassenden Zugang freuen, selbstverständlich im Rahmen der Vereinsrichtlinien und des Mannschaftsprogramms.',angle:'Weitere redaktionelle Informationen',close:'Uns ist bewusst, dass alle Zugänge von Verfügbarkeit und Akkreditierungsrichtlinien abhängen. Vielen Dank für die Prüfung unserer Anfrage. Wir freuen uns auf Ihre Rückmeldung.',regards:'Mit freundlichen Grüßen',date:'Datum',roles:'Funktion'},es:{subject:'Solicitud de acreditación de prensa',hello:'Estimado equipo de prensa y acreditaciones:',intro:'Nos gustaría solicitar acreditación de prensa para el siguiente partido:',for:'Medio',app:'Solicitantes',access:'Si fuera posible, agradeceríamos también acceso a:',social:'Nuestra cobertura incluye vídeos cortos y contenido para las redes sociales de nuestra sección de deportes.',broad:'Agradeceríamos el acceso más amplio posible, siempre de acuerdo con las normas del club y la disponibilidad del equipo.',angle:'Información editorial adicional',close:'Entendemos que los accesos dependen de la disponibilidad y de las normas de acreditación. Muchas gracias por considerar nuestra solicitud. Quedamos a la espera de su respuesta.',regards:'Atentamente',date:'Fecha',roles:'Función'},fr:{subject:'Demande d’accréditation de presse',hello:'Bonjour à l’équipe presse et accréditations,',intro:'Nous souhaitons demander une accréditation de presse pour le match suivant :',for:'Média',app:'Demandeurs',access:'Dans la mesure du possible, nous souhaiterions également accéder aux espaces suivants :',social:'Notre couverture comprend aussi des vidéos courtes et des contenus destinés aux réseaux sociaux de notre rédaction sportive.',broad:'Nous apprécierions l’accès le plus large possible, dans le respect des règles du club et du programme de l’équipe.',angle:'Informations éditoriales complémentaires',close:'Nous comprenons que ces accès dépendent des disponibilités et des règles d’accréditation. Merci de l’attention portée à notre demande. Dans l’attente de votre réponse.',regards:'Cordialement',date:'Date',roles:'Fonction'},it:{subject:'Richiesta di accredito stampa',hello:'Gentile ufficio stampa e accrediti,',intro:'Desideriamo richiedere un accredito stampa per la seguente partita:',for:'Testata',app:'Richiedenti',access:'Se possibile, gradiremmo inoltre accedere a:',social:'La nostra copertura comprende anche brevi video e contenuti per i canali social della redazione sportiva.',broad:'Saremmo grati per il più ampio accesso possibile, sempre nel rispetto delle regole del club e degli impegni della squadra.',angle:'Ulteriori informazioni editoriali',close:'Comprendiamo che gli accessi dipendono dalla disponibilità e dalle norme di accredito. Grazie per l’attenzione alla nostra richiesta. Restiamo in attesa di un riscontro.',regards:'Cordiali saluti',date:'Data',roles:'Ruolo'}};
const accessNames={no:['Pressetribune','Mixed zone','Pressekonferanse','Banenivå / sidelinje','Treningsøkt','Spillerintervjuer','Trenerintervju','SoMe-aktiviteter med spillere','Omvisning / bak kulissene'],en:items.map(x=>x[1]),de:['Pressetribüne','Mixed Zone','Pressekonferenz','Spielfeldrand','Trainingseinheit','Spielerinterviews','Trainerinterview','Social-Media-Aktivitäten mit Spielern','Blick hinter die Kulissen / Stadionführung'],es:['Tribuna de prensa','Zona mixta','Rueda de prensa','Acceso a pie de campo','Entrenamiento','Entrevistas con jugadores','Entrevista con el entrenador','Actividades para redes sociales con jugadores','Visita entre bastidores / al estadio'],fr:['Tribune de presse','Zone mixte','Conférence de presse','Bord du terrain','Séance d’entraînement','Interviews de joueurs','Interview de l’entraîneur','Activités réseaux sociaux avec les joueurs','Visite des coulisses / du stade'],it:['Tribuna stampa','Zona mista','Conferenza stampa','Bordo campo','Allenamento','Interviste ai giocatori','Intervista all’allenatore','Attività social con i giocatori','Visita dietro le quinte / dello stadio']};
function addPerson(name='',role='Journalist'){let n=++counter;let d=document.createElement('div');d.className='person';d.innerHTML=`<div class="grid"><div><label>Navn</label><input class="pname" placeholder="Fullt navn"></div><div><label>Rolle</label><input class="prole" placeholder="Journalist / fotograf"></div></div><div class="actions"><button type="button" class="danger remove">Fjern person</button></div>`;d.querySelector('.pname').value=name;d.querySelector('.prole').value=role;d.querySelector('.remove').onclick=()=>{if(document.querySelectorAll('.person').length>1){d.remove();render()}};$('people').append(d);render()}
items.forEach(([id,name],i)=>{let l=document.createElement('label');l.className='check';l.innerHTML=`<input type="checkbox" data-access="${id}" ${i===0?'checked':''}><span>${name}</span>`;$('access').append(l)});
function render(){let lang=$('language').value,t=tr[lang],home=$('home').value.trim()||'[Home team]',away=$('away').value.trim()||'[Away team]',media=$('media').value==='other'?$('other').value.trim()||'[Media organisation]':$('media').value,people=[...document.querySelectorAll('.person')].map(p=>({name:p.querySelector('.pname').value.trim(),role:p.querySelector('.prole').value.trim()})).filter(p=>p.name),date=$('date').value?new Date($('date').value+'T12:00:00').toLocaleDateString(lang==='no'?'nb-NO':lang==='en'?'en-GB':lang==='de'?'de-DE':lang==='es'?'es-ES':lang==='fr'?'fr-FR':'it-IT',{day:'numeric',month:'long',year:'numeric'}):'[Date]',chosen=[...document.querySelectorAll('[data-access]:checked')].map(e=>accessNames[lang][items.findIndex(i=>i[0]===e.dataset.access)]);let lines=[t.subject,'',t.hello,'',t.intro,`${home} – ${away}`,`${t.date}: ${date}`,`${t.for}: ${media}`,'',t.app+':',...(people.length?people.map(p=>`• ${p.name}${p.role?' – '+p.role:''}`):['• [Name – role]'])];if($('social').checked)lines.push('',t.social);if(chosen.length)lines.push('',t.access,...chosen.map(x=>'• '+x));if($('broad').checked)lines.push('',t.broad);if($('angleOn').checked&&$('angle').value.trim())lines.push('',t.angle+':',$('angle').value.trim());lines.push('',t.close,'',t.regards,media);$('preview').textContent=lines.join('\n')}
$('add').onclick=()=>addPerson('','Journalist');$('media').onchange=()=>{$('otherWrap').hidden=$('media').value!=='other';render()};$('angleOn').onchange=()=>{$('angle').hidden=!$('angleOn').checked;render()};$('broad').onchange=()=>{if($('broad').checked)document.querySelectorAll('[data-access]').forEach(x=>x.checked=true);render()};document.addEventListener('input',render);document.addEventListener('change',render);$('copy').onclick=async()=>{try{await navigator.clipboard.writeText($('preview').textContent);$('copy').textContent='Kopiert!';setTimeout(()=>$('copy').textContent='Kopier tekst',1800)}catch(e){alert('Kopiering ble blokkert. Marker teksten i forhåndsvisningen i stedet.')}};$('pdf').onclick=()=>window.print();addPerson('','Journalist');
</script></body></html>
